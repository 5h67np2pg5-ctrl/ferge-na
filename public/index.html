<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b4f8a" />
    <title>Fergetider</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell" id="appShell">
      <section class="topbar" aria-label="Status" data-i18n-aria="status">
        <div>
          <h1 data-i18n="appName">Fergetider</h1>
        </div>
        <button class="icon-button" id="refreshButton" type="button" aria-label="Reset lokasjon" data-i18n-aria="resetLocation">↻</button>
      </section>
      <section class="language-bar" aria-label="Velg språk" data-i18n-aria="languageChoice">
        <button class="language-chip" type="button" data-language="no" aria-pressed="true">🇳🇴</button>
        <button class="language-chip" type="button" data-language="en" aria-pressed="false">🇬🇧</button>
        <button class="language-chip" type="button" data-language="de" aria-pressed="false">🇩🇪</button>
        <button class="language-chip" type="button" data-language="es" aria-pressed="false">🇪🇸</button>
        <button class="language-chip" type="button" data-language="fr" aria-pressed="false">🇫🇷</button>
        <button class="language-chip" type="button" data-language="it" aria-pressed="false">🇮🇹</button>
      </section>

      <section class="quick-actions" aria-label="Start" data-i18n-aria="start">
        <button class="primary-action" id="locateButton" type="button" data-i18n="usePosition">Bruk min posisjon</button>
      </section>

      <section class="destination-panel" aria-label="Endelig destinasjon" data-i18n-aria="finalDestination">
        <label for="destinationInput" data-i18n="finalDestination">Endelig destinasjon</label>
        <div class="destination-input-wrap">
          <input id="destinationInput" type="search" autocomplete="off" placeholder="Skriv sted, adresse eller kai" data-i18n-placeholder="destinationPlaceholder" />
          <button class="clear-input-button" id="clearDestinationButton" type="button" aria-label="Tøm destinasjon" data-i18n-aria="clearDestination" hidden>×</button>
        </div>
        <div class="suggestions" id="destinationSuggestions"></div>
      </section>

      <div class="wave-divider" aria-hidden="true"></div>

      <section class="hero-panel" aria-live="polite">
        <div class="status-row">
          <span class="status-pill" id="statusPill">Venter på posisjon</span>
          <span id="updatedAt">--:--</span>
        </div>
        <div class="decision-grid">
          <div>
            <span class="label" data-i18n="nextFerry">Neste ferge</span>
            <strong id="departureTime" class="departure-list">--:--</strong>
          </div>
          <div>
            <span class="label" data-i18n="normalDrive">Normal kjøretid</span>
            <strong id="normalDriveTime">--</strong>
          </div>
          <div>
            <span class="label" data-i18n="quayWait">Ventetid ved kai</span>
            <strong id="margin">-- min</strong>
          </div>
        </div>
        <h2 id="routeName">Finn nærmeste fergesamband</h2>
        <p id="recommendation">Del posisjon for å se aktuell avreiseside og om du rekker avgangen.</p>
        <button class="secondary-action map-toggle" id="mapButton" type="button" hidden data-i18n="showMap">Vis kart</button>
        <button class="secondary-action widget-download" id="widgetButton" type="button" hidden data-i18n="downloadWidget">Last ned widget</button>
      </section>

      <section class="metrics" aria-label="Reise videre" data-i18n-aria="travelOnward">
        <article>
          <span data-i18n="crossing">Overfart</span>
          <strong id="crossingTime">--</strong>
        </article>
        <article id="onwardMetric" hidden>
          <span data-i18n="onwardFromQuay">Videre fra kai</span>
          <strong id="onwardTime">--</strong>
        </article>
        <article id="totalMetric" hidden>
          <span data-i18n="toDestination">Til destinasjon</span>
          <strong id="totalTime">--</strong>
        </article>
      </section>

      <section class="notice-stack" id="noticeStack" aria-label="Varsler" data-i18n-aria="alerts"></section>

      <section class="list-section">
        <div class="section-heading">
          <h2 id="routeListTitle">Nærmeste samband</h2>
          <span id="sourceLabel">Demo</span>
        </div>
        <div class="route-list" id="routeList"></div>
      </section>
    </main>

    <section class="map-sheet" id="mapSheet" aria-label="Kart" data-i18n-aria="map" hidden>
      <div class="map-panel">
        <div class="map-header">
          <strong id="mapTitle">Kart</strong>
          <button class="secondary-action" id="closeMapButton" type="button" data-i18n="closeMap">Lukk kart</button>
        </div>
        <div class="map-body" id="mapCanvas" role="img" aria-label="Kart over valgt rute" data-i18n-aria="routeMap"></div>
        <div class="map-controls" aria-label="Zoom" data-i18n-aria="zoom">
          <button id="zoomInButton" type="button" aria-label="Zoom inn">+</button>
          <button id="zoomOutButton" type="button" aria-label="Zoom ut">-</button>
        </div>
      </div>
    </section>

    <script src="/app.js" type="module"></script>
  </body>
</html>
